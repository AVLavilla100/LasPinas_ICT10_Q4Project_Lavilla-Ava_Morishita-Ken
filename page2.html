<body>
    
    <div class="container">

        <h1 style="text-align: center; margin-top: 30px; color: rgb(26, 26, 26);">G10 Attendance Tracker</h1>
        <p style="text-align: center; color: rgb(26, 26, 26);"><strong>Generate attendance of grade 10 👀📚</strong></p>

        <div class="row g-4">
            <div class="col-12 d-flex flex-wrap gap-4">
                
                <!-- Menu Card -->
                <div class="menu-card p-4 flex-fill container rounded" style="max-width: 300px; max-height: 250px; background-color: white; margin-top: 18px; box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;">
                    <h3 class="mb-3" style="color: rgb(26, 26, 26);">Attendance Tracker</h3>
                    <div class="mb-3">
                        <select for="section" class="form-select" id="Select_Day" name="SelectDay">Select Weeks</label>
                            <option selected>Choose the Week here</option>
                            <option value="Week1">Week1</option>
                            <option value="Week2">Week2</option>
                            <option value="Week3">Week3</option>
                            <option value="Week4">Week4</option>
                            <option value="Week5">Week5</option>
                            <option value="Week6">Week6</option>
                            <option value="Week7">Week7</option>
                            <option value="Week8">Week8</option>
                            <option value="Week9">Week9</option>
                            <option value="Week10">Week10</option>
                            <option value="Week11">Week11</option>
                            <option value="Week12">Week12</option>
                            <option value="Week13">Week13</option>
                            <option value="Week14">Week14</option>
                            <option value="Week15">Week15</option>  
                        </select>
                    </div>
                    <div class="mb-3">
                        <input type="number" class="form-control" id="Future_profession" placeholder="Enter the number of absences">
                    </div>
                    <div>
                        <button class="btn btn-outline-primary" py-click="addgraph">Generate Graph</button>
                        <!--<button class="btn btn-dark" py-click="showlist">Show List</button>-->
                    </div>
                    <p style="font-size: 10px; margin-top: 5px;">Note: Graph takes a while to load...</p>
                </div>

                <!-- Customer Details Card -->
                <div class="menu-card p-4 flex-fill" style="min-width: 100px;">
                    <img src="" alt="" id="graphforplot">
                </div>

            </div>
        </div>
    </div>

    <!-- ===== Order Summary ===== -->
    <div class="container">
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

        packages = ["numpy", "matplotlib"]

    <script type="py" src="main2.py"></script>
